<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Кузня Миров</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #scene {
        display: block;
      }

      #scene[hidden] {
        display: none;
      }

      #game-select {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        margin: 0;
        background: #0e1018;
        color: #e6e6e6;
        font: 16px/1.6 ui-monospace, "Cascadia Code", Consolas, monospace;
      }

      #game-select[hidden] {
        display: none;
      }

      #game-select h1 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 400;
        color: #9aa0ac;
      }

      #game-select-list {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        min-width: 16rem;
      }

      .game-option {
        padding: 1rem 1.5rem;
        font: inherit;
        font-size: 1.1rem;
        color: #e6e6e6;
        background: #1b1e29;
        border: 1px solid #2c303c;
        border-radius: 0.5rem;
        cursor: pointer;
      }

      .game-option:hover,
      .game-option:focus-visible {
        background: #262b3a;
        border-color: #3d4356;
      }

      #game-select-failures {
        max-width: 24rem;
        margin: 0;
        font-size: 0.85rem;
        color: #b08a8a;
        text-align: center;
      }

      #error {
        position: fixed;
        inset: 0;
        margin: 0;
        padding: 2rem;
        box-sizing: border-box;
        background: #12141a;
        color: #f2b8b8;
        font: 16px/1.6 ui-monospace, "Cascadia Code", Consolas, monospace;
        white-space: pre-wrap;
        overflow: auto;
      }

      #warnings-panel {
        position: fixed;
        right: 1rem;
        bottom: 1rem;
        display: flex;
        flex-direction: column-reverse;
        align-items: flex-end;
        gap: 0.5rem;
        font: 14px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace;
        z-index: 10;
      }

      #warnings-panel[hidden] {
        display: none;
      }

      #warnings-bar {
        display: flex;
        align-items: stretch;
        background: #1b1e29;
        border: 1px solid #40391f;
        border-radius: 0.5rem;
        overflow: hidden;
      }

      #warnings-toggle {
        padding: 0.5rem 0.9rem;
        font: inherit;
        color: #e0c785;
        background: transparent;
        border: none;
        cursor: pointer;
        white-space: nowrap;
      }

      #warnings-toggle:hover,
      #warnings-toggle:focus-visible {
        background: #262b3a;
      }

      #warnings-close {
        padding: 0.5rem 0.7rem;
        font: inherit;
        color: #9aa0ac;
        background: transparent;
        border: none;
        border-left: 1px solid #40391f;
        cursor: pointer;
      }

      #warnings-close:hover,
      #warnings-close:focus-visible {
        background: #262b3a;
        color: #e6e6e6;
      }

      #warnings-list {
        max-width: min(28rem, calc(100vw - 2rem));
        max-height: 40vh;
        margin: 0;
        padding: 0.75rem 1rem;
        box-sizing: border-box;
        background: #12141a;
        color: #e0c785;
        border: 1px solid #40391f;
        border-radius: 0.5rem;
        white-space: pre-wrap;
        overflow: auto;
      }

      #warnings-list[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <main id="game-select" hidden>
      <h1>Кузня Миров</h1>
      <div id="game-select-list"></div>
    </main>
    <pre id="error" hidden></pre>
    <div id="warnings-panel" hidden>
      <pre id="warnings-list" hidden></pre>
      <div id="warnings-bar">
        <button type="button" id="warnings-toggle"></button>
        <button type="button" id="warnings-close" aria-label="Закрыть предупреждения">×</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
