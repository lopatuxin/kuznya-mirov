[package]
name = "importer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
block_compression = { version = "0.11.0", default-features = false, features = ["bc7", "bc15"] }
engine = { version = "0.1.0", path = "../engine" }
gltf = { version = "1.4.1", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[dev-dependencies]
ktx2 = "0.5.0"
