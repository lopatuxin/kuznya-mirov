[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true

[dependencies]
libm = "0.2.16"
luars = { path = "../luars", features = ["sandbox", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.wasm32-unknown-unknown.dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
console_error_panic_hook = "0.1.7"
glyphon = "0.11"
js-sys = "0.3.105"
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
web-sys = { version = "0.3.105", features = ["HtmlCanvasElement", "HtmlMediaElement", "HtmlVideoElement", "console"] }
wgpu = { version = "29.0.4", default-features = false, features = ["webgpu", "webgl", "wgsl", "std"] }

[dev-dependencies]
naga = { version = "29.0.4", default-features = false, features = ["wgsl-in", "glsl-out"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O1"]
