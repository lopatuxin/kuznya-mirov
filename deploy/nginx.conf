worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;

    server {
        listen 80;
        listen [::]:80;
        root /usr/share/nginx/html;
        index index.html;

        location = /health {
            default_type text/plain;
            return 200 'ok';
        }

        # Сборка Vite кладёт сюда файлы с меткой версии в имени (index-<hash>.js, engine_bg-<hash>.wasm):
        # новая сборка — новое имя, так что их можно не перепроверять.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Редактор (Фаза 09, требование 27) пишет файлы проекта через PUT: только .json
        # внутри папки конкретного проекта /games/<имя>/..., путь может уходить глубже
        # одного уровня. create_full_put_path off — нет папки, нет записи, nginx её не
        # создаёт. dav_methods без GET/HEAD/DELETE — эта location только принимает запись,
        # чтение файла по-прежнему идёт через location / ниже. Запись — во временный файл
        # рядом с целью и переименование (штатное поведение ngx_http_dav_module).
        location ~ ^/games/[^/]+/.+\.json$ {
            dav_methods PUT;
            create_full_put_path off;
        }

        # Страница и файлы игр (/games/...) имён не меняют: без этого браузер сам решает какое-то
        # время их не спрашивать и после пересборки показывает старую версию. no-cache — спрашивать
        # каждый раз, неизменный файл отвечает 304 по ETag.
        #
        # PUT сюда не попадает — ловится либо location выше (свой .json в games/<имя>/), либо
        # остаётся здесь: core-модуль nginx PUT не поддерживает и без dav_methods отвечает 405 —
        # ровно то, что требование 27 просит для всех прочих путей.
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ =404;
        }
    }
}
