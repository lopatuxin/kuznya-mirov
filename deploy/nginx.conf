worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;

    server {
        listen 80;
        listen [::]:80;
        root /usr/share/nginx/html;
        index index.html;

        location = /health {
            default_type text/plain;
            return 200 'ok';
        }

        # Сборка Vite кладёт сюда файлы с меткой версии в имени (index-<hash>.js, engine_bg-<hash>.wasm):
        # новая сборка — новое имя, так что их можно не перепроверять.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Страница и файлы игр (/games/...) имён не меняют: без этого браузер сам решает какое-то
        # время их не спрашивать и после пересборки показывает старую версию. no-cache — спрашивать
        # каждый раз, неизменный файл отвечает 304 по ETag.
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ =404;
        }
    }
}
