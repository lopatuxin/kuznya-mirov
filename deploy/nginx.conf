worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;

    server {
        listen 80;
        listen [::]:80;
        root /usr/share/nginx/html;
        index index.html;

        location = /health {
            default_type text/plain;
            return 200 'ok';
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
