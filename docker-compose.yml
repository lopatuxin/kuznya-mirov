services:
  web:
    build: .
    ports:
      # Стенд открыт только этому компьютеру (Фаза 09, требование 27) — без 127.0.0.1
      # порт слушает все интерфейсы, и запись файлов проекта стала бы доступна по сети.
      - "127.0.0.1:${WEB_PORT:-8090}:80"
    volumes:
      # Редактор (Фаза 08, требование 1) сам замечает правки в файлах проекта и перезагружает его —
      # для этого стенд должен раздавать games/ из рабочей копии репозитория, а не из образа: правка
      # видна сразу, без docker compose build. Фаза 09 добавила запись — редактор пишет сюда через
      # PUT (deploy/nginx.conf), поэтому без :ro. Образ по-прежнему несёт свою копию games/
      # (см. Dockerfile) для публикации без такого монтирования.
      - ./games:/usr/share/nginx/html/games
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
